name: Publish MAD draft

on:
  push:
    branches:
      - main
    paths:
      - .publish/READY

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble source
        shell: bash
        run: |
          cat .publish/part-* > manuscript.tex.gz.b64
          base64 -d manuscript.tex.gz.b64 > manuscript.tex.gz
          gzip -dc manuscript.tex.gz > manuscript.tex

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: manuscript.tex
          latexmk_use_xelatex: false

      - name: Install PDF and update publications page
        shell: bash
        run: |
          mkdir -p papers
          cp manuscript.pdf papers/separating-pi1nplus2-sigma1nplus2-mad-families.pdf
          python3 - <<'PY'
          from pathlib import Path
          p = Path('publications.md')
          text = p.read_text()
          link = '/papers/separating-pi1nplus2-sigma1nplus2-mad-families.pdf'
          if link not in text:
              marker = '## Preprints/Notes'
              block = '''## Drafts\n\n- **Separating \\(\\Pi^1_{n+2}\\) and \\(\\Sigma^1_{n+2}\\) Maximal Almost Disjoint Families**.  \n  Draft, 6 September 2026.  \n  [PDF](/papers/separating-pi1nplus2-sigma1nplus2-mad-families.pdf)\n\n'''
              if marker not in text:
                  raise SystemExit('Preprints/Notes marker not found')
              text = text.replace(marker, block + marker, 1)
              p.write_text(text)
          PY

      - name: Remove temporary build inputs and publish commit
        shell: bash
        run: |
          rm -rf .publish manuscript.tex manuscript.tex.gz manuscript.tex.gz.b64 manuscript.aux manuscript.fdb_latexmk manuscript.fls manuscript.log manuscript.out manuscript.pdf
          rm -f .github/workflows/publish-mad-draft.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add MAD families draft to website'
          git push origin HEAD:main
