name: Build current MOF preprint

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-current-mof.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct LaTeX source
        run: |
          cat .site-build/mof-source-1.b64 .site-build/mof-source-2.b64 .site-build/mof-source-3.b64 | base64 -d | gunzip > /tmp/mof.tex

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Compile PDF
        run: |
          mkdir -p /tmp/mof-build
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/mof-build /tmp/mof.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/mof-build /tmp/mof.tex
          cp /tmp/mof-build/mof.pdf papers/higher-projectively-definable-mofs.pdf

      - name: Commit updated PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/higher-projectively-definable-mofs.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update higher projective MOF preprint PDF'
          git push origin HEAD:main
