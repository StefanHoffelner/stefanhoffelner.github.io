name: Finalize current MOF preprint

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-current-mof.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move paper to preprints and clean build files
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('publications.md')
          text = path.read_text(encoding='utf-8')

          marker = '\n13. **Projective maximal families of orthogonal measures and global'
          start = text.find(marker)
          if start == -1:
              raise SystemExit('Submitted MOF entry not found')
          end = text.find('\n\n## Drafts', start)
          if end == -1:
              raise SystemExit('Drafts section marker not found')
          text = text[:start] + text[end:]

          old_title = '**Higher projectively definable maximal orthogonal families**'
          new_title = '**Higher projective maximal orthogonal families of measures**'
          if old_title not in text:
              raise SystemExit('Existing preprint entry not found')
          text = text.replace(old_title, new_title, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git rm -f .site-build/mof-source-1.b64 .site-build/mof-source-2.b64 .site-build/mof-source-3.b64 .github/workflows/build-current-mof.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications.md
          git commit -m 'Move higher projective MOF paper to preprints'
          git push origin HEAD:main
