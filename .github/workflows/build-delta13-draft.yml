name: Build Delta13 draft PDF

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode TeX source
        run: |
          cat .tmp/delta13-source.part00 .tmp/delta13-source.part01 .tmp/delta13-source.part02 .tmp/delta13-source.part03 \
            | base64 -d | gunzip > papers/delta13-regularity-definable-uniformization.tex
      - name: Compile PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: delta13-regularity-definable-uniformization.tex
          working_directory: papers
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/delta13-regularity-definable-uniformization.pdf
          git commit -m "Add Delta13 regularity draft PDF" || exit 0
          git push
